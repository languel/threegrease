<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3𝜻 · threegrease — Grease Pencil in three.js</title>
  <!-- installable: an INSTALLED app's popups to its own pages (the output
       windows) open as app windows, without the address bar a browser
       tab's popup always carries -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#1b1b1d" />
  <link rel="stylesheet" href="/src/app/styles.css" />
</head>
<body>
  <div id="app">
    <div id="menubar"></div>
    <div id="topbar"></div>
    <div id="middle">
      <div id="toolbar"></div>
      <div id="viewport">
        <canvas id="gl"></canvas>
        <canvas id="hud"></canvas>
        <div id="status"></div>
      </div>
      <div id="sidebar-resize" title="Drag to resize"></div>
      <div id="sidebar"></div>
    </div>
    <div id="timeline"></div>
  </div>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
